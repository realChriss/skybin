[package]
name = "skybin"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "persistence"] }
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
egui_extras = "0.37.0"
rfd = "0.17.2"
rust-s3 = { version = "0.38.0", default-features = false, features = ["tokio-rustls-tls", "fail-on-err"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "fs"] }

[profile.release]
strip = true
lto = "thin"

[dev-dependencies]
egui_kittest = "0.37.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

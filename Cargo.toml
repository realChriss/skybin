[package]
name = "skybin"
version = "0.1.8"
edition = "2024"
license = "Apache-2.0"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "links", "persistence", "wayland", "x11"] }
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37.0", default-features = false, features = ["image", "gif", "webp"] }
# pure-Rust video decoding; the codec hub isn't on crates.io, and a version tag lets Dependabot bump it
filmcraft-codecs = { git = "https://github.com/storytold/filmcraft", tag = "v0.14.0" }
filmcraft-media = { git = "https://github.com/storytold/filmcraft", tag = "v0.14.0" }
filmcraft-time = { git = "https://github.com/storytold/filmcraft", tag = "v0.14.0" }
image = { version = "0.25.10", default-features = false, features = ["bmp", "jpeg", "png"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
rfd = "0.17.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
rust-s3 = { version = "0.38.0", default-features = false, features = ["tokio-rustls-tls", "fail-on-err"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "fs"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

[build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
egui_kittest = "0.37.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(not(windows))'.dependencies]
keyring = "4.2"
chacha20poly1305 = "0.11"
